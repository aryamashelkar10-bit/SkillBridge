<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up | SkillBridge</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- ===== NAVIGATION BAR ===== -->
  <nav class="navbar">
    <div class="nav-inner">
      <a href="index.html" class="nav-logo">Skill<span>Bridge</span></a>

      <button class="nav-toggle" aria-label="Toggle navigation">
        <span></span>
        <span></span>
        <span></span>
      </button>

      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="teammates.html">Find Teammates</a></li>
        <li><a href="projects.html">Projects</a></li>
        <li><a href="post-project.html">Post Project</a></li>
        <li><a href="profile.html">Profile</a></li>
        <li><a href="login.html" class="btn-nav-login">Login</a></li>
      </ul>
    </div>
  </nav>

  <!-- ===== SIGN UP FORM ===== -->
  <!-- Wider auth card to fit more fields -->
  <div class="auth-page">
    <div class="auth-card" style="max-width:520px;">

      <div class="auth-logo">Skill<span>Bridge</span></div>
      <h1 class="auth-title">Create an Account</h1>
      <p class="auth-subtitle">Join SkillBridge with your college email.</p>

      <form id="signupForm" novalidate>

        <!-- Full Name -->
        <div class="form-group">
          <label for="signupName">Full Name *</label>
          <input type="text" id="signupName" placeholder="e.g. Arjun Sharma" />
          <span class="form-error" id="errSignupName"></span>
        </div>

        <!-- College Email -->
        <div class="form-group">
          <label for="signupEmail">College Email *</label>
          <input type="email" id="signupEmail" placeholder="yourname@college.edu" />
          <span class="form-error" id="errSignupEmail"></span>
        </div>

        <!-- Password -->
        <div class="form-group">
          <label for="signupPass">Password *</label>
          <input type="password" id="signupPass" placeholder="Minimum 6 characters" />
          <span class="form-error" id="errSignupPass"></span>
        </div>

        <!-- Branch and Year in a two-column row -->
        <div class="form-row">
          <div class="form-group">
            <label for="signupBranch">Branch *</label>
            <select id="signupBranch">
              <option value="">Select branch</option>
              <option value="Computer Engineering">Computer Engineering</option>
              <option value="Information Technology">Information Technology</option>
              <option value="Electronics">Electronics Engineering</option>
              <option value="Mechanical">Mechanical Engineering</option>
              <option value="Civil">Civil Engineering</option>
              <option value="Other">Other</option>
            </select>
            <span class="form-error" id="errSignupBranch"></span>
          </div>

          <div class="form-group">
            <label for="signupYear">Year *</label>
            <select id="signupYear">
              <option value="">Select year</option>
              <option value="1st Year">1st Year</option>
              <option value="2nd Year">2nd Year</option>
              <option value="3rd Year">3rd Year</option>
              <option value="4th Year">4th Year</option>
            </select>
            <span class="form-error" id="errSignupYear"></span>
          </div>
        </div>

        <!-- Skills -->
        <div class="form-group">
          <label for="signupSkills">Your Skills</label>
          <input
            type="text"
            id="signupSkills"
            placeholder="e.g. Python, HTML/CSS, JavaScript (comma separated)"
          />
        </div>

        <!-- Interests -->
        <div class="form-group">
          <label for="signupInterests">Your Interests</label>
          <input
            type="text"
            id="signupInterests"
            placeholder="e.g. Web Development, AI/ML, Hackathons"
          />
        </div>

        <!-- Create Account Button -->
        <button type="submit" class="btn btn-primary">Create Account</button>

      </form>

      <!-- Link back to Login -->
      <p class="auth-footer-text">
        Already have an account? <a href="login.html">Login</a>
      </p>

    </div>
  </div>

  <script src="js/script.js"></script>
</body>
</html>
